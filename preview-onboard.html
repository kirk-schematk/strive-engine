     the inline lesson step exercises the local strive-lesson.js too; drop

     http://localhost:8765/preview-onboard.html?mock=1 -->

<body style="margin:0">
  <section><div id="strive-onboard"></div></section>
  <script src="./strive-onboard.js" defer></script>
